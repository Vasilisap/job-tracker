<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        const isDark =
          theme === "dark" ||
          (theme === null &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);

        document.documentElement.classList.toggle("dark", isDark);
      } catch {
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;

        document.documentElement.classList.toggle("dark", prefersDark);
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Trapper · Track every job application</title>
    <meta
      name="description"
      content="Job Trapper keeps your job search in one place: every application, its status and its history, from wishlist to offer."
    />

    <!-- Link previews (LinkedIn, Slack, WhatsApp, …). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Job Trapper" />
    <meta property="og:url" content="https://jobtrapper.netlify.app/" />
    <meta
      property="og:title"
      content="Job Trapper · Track every job application"
    />
    <meta
      property="og:description"
      content="Catch every opportunity. Track every application, its status and its history, from wishlist to offer."
    />
    <meta
      property="og:image"
      content="https://jobtrapper.netlify.app/og-image.png"
    />
    <meta property="og:image:width" content="1583" />
    <meta property="og:image:height" content="1039" />
    <meta
      property="og:image:alt"
      content="The Job Trapper dashboard with application cards, status badges, a status timeline and filters."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
